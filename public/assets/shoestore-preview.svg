<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="store-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132b" />
      <stop offset="100%" stop-color="#1c2541" />
    </linearGradient>
    <linearGradient id="orange-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#fb923c" />
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" rx="16" fill="url(#store-bg)" />
  <rect x="1" y="1" width="798" height="498" rx="15" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Top bar -->
  <rect x="0" y="0" width="800" height="56" fill="#0f172a" fill-opacity="0.9"/>
  <circle cx="36" cy="28" r="6" fill="#ef4444"/>
  <circle cx="56" cy="28" r="6" fill="#f59e0b"/>
  <circle cx="76" cy="28" r="6" fill="#10b981"/>
  <text x="110" y="33" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="14" font-weight="700">KicksHub — React 19 &amp; Vite E-Commerce Storefront</text>
  
  <!-- Cart badge -->
  <rect x="680" y="14" width="90" height="28" rx="14" fill="#f97316"/>
  <text x="725" y="32" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">🛒 Cart (3)</text>

  <!-- Hero Banner inside app -->
  <rect x="25" y="75" width="750" height="140" rx="12" fill="url(#card-grad)" stroke="#334155" stroke-width="1"/>
  <text x="50" y="112" fill="#f97316" font-family="system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="1">SPRING 2026 COLLECTION</text>
  <text x="50" y="145" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="24" font-weight="800">Engineered For Performance &amp; Style</text>
  <text x="50" y="172" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">High-speed React 19 rendering with Vite HMR and dynamic client-side filtering</text>
  
  <!-- Sneaker Silhouette SVG -->
  <path d="M540 180 C570 140, 630 110, 680 120 C710 125, 730 150, 720 170 C700 185, 660 190, 580 190 Z" fill="url(#orange-grad)" opacity="0.85"/>
  <ellipse cx="640" cy="188" rx="70" ry="8" fill="#000000" opacity="0.4"/>

  <!-- Product Grid (3 cards) -->
  <!-- Card 1 -->
  <rect x="25" y="235" width="235" height="235" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <rect x="40" y="250" width="205" height="110" rx="8" fill="#0f172a"/>
  <!-- Sneaker graphic 1 -->
  <path d="M70 310 C90 280, 140 270, 180 290 C200 300, 210 320, 190 325 C150 330, 90 330, 70 310 Z" fill="#38bdf8"/>
  <text x="40" y="380" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Air Zoom Nitro</text>
  <text x="40" y="398" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Running / Lightweight</text>
  <text x="40" y="425" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="15" font-weight="700">$139.00</text>
  <rect x="180" y="405" width="65" height="28" rx="6" fill="#0284c7"/>
  <text x="212" y="423" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">+ Add</text>

  <!-- Card 2 -->
  <rect x="282" y="235" width="235" height="235" rx="12" fill="#1e293b" stroke="#f97316" stroke-width="1.5"/>
  <rect x="297" y="250" width="205" height="110" rx="8" fill="#0f172a"/>
  <!-- Sneaker graphic 2 -->
  <path d="M327 310 C347 280, 397 270, 437 290 C457 300, 467 320, 447 325 C407 330, 347 330, 327 310 Z" fill="#f97316"/>
  <text x="297" y="380" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Velocity Pro Street</text>
  <text x="297" y="398" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Streetwear / Cushion</text>
  <text x="297" y="425" fill="#fb923c" font-family="system-ui, sans-serif" font-size="15" font-weight="700">$175.00</text>
  <rect x="437" y="405" width="65" height="28" rx="6" fill="#ea580c"/>
  <text x="469" y="423" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">In Cart ✓</text>

  <!-- Card 3 -->
  <rect x="540" y="235" width="235" height="235" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <rect x="555" y="250" width="205" height="110" rx="8" fill="#0f172a"/>
  <!-- Sneaker graphic 3 -->
  <path d="M585 310 C605 280, 655 270, 695 290 C715 300, 725 320, 705 325 C665 330, 605 330, 585 310 Z" fill="#a855f7"/>
  <text x="555" y="380" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Quantum Glide</text>
  <text x="555" y="398" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Cross-Trainer / Grip</text>
  <text x="555" y="425" fill="#c084fc" font-family="system-ui, sans-serif" font-size="15" font-weight="700">$155.00</text>
  <rect x="695" y="405" width="65" height="28" rx="6" fill="#9333ea"/>
  <text x="727" y="423" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">+ Add</text>
</svg>
